name: CI (disabled)

# Deploys now run in Cloudflare Workers Builds, connected to this repository
# under Worker `massage` → Settings → Build.
#
# This file is intentionally inert: `workflow_dispatch` only, so it never runs
# on a push or a pull request and cannot race the Cloudflare build.
#
# To remove it completely, delete this file in the GitHub UI — the push path
# available to the agent that created it rejects commits containing deletions.
#
# If you ever want pull-request checks back without deploying, re-add:
#
#   on:
#     pull_request:
#
#   jobs:
#     verify:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v4
#         - uses: actions/setup-node@v4
#           with:
#             node-version: '22'
#             cache: npm
#         - run: npm ci
#         - run: npm run typecheck
#         - run: npm test
#         - run: npx wrangler deploy --dry-run --outdir=.dry-run

on:
  workflow_dispatch:

jobs:
  notice:
    name: Nothing to do
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "CI/CD is handled by Cloudflare Workers Builds."
          echo "Deploys happen when a commit lands on main, not from GitHub Actions."
