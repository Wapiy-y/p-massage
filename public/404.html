<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f4">
<meta name="robots" content="noindex">
<title>Page not found</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="page">
  <div class="wrap">
    <div class="done" style="padding-top:72px">
      <div class="tick" style="background:#f6f1ea;color:var(--muted)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <h1>Page not found</h1>
      <p class="small muted" style="margin:10px 0 24px">
        That link does not exist. If someone sent you a feedback link, double-check it.
      </p>
      <a class="btn btn-ghost btn-block" href="/">Back to the homepage</a>
    </div>
  </div>
</div>
</body>
</html>
