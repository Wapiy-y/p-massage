#:schema node_modules/wrangler/config-schema.json
name = "massage"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Static assets from public/ are served from the edge; the Worker handles /api/*
# and the clean URLs (/feedback, /admin, /privacy).
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
RATE_LIMIT_MAX = "3"
TURNSTILE_SITE_KEY = "0x4AAAAAAFg1_CZYHA6TUoeq"

[[d1_databases]]
binding = "DB"
database_name = "massage-feedback"
database_id = "ef09ab96-ad99-48ab-abdb-4b28509c0119"
migrations_dir = "migrations"

[observability]
enabled = true

# Purge the 30-day IP hashes. Runs on the Worker itself, which is why this
# cannot stay on Cloudflare Pages Functions.
[triggers]
crons = ["17 3 * * *"]
