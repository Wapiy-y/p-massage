name: CI / CD

# Pull request  →  verify only (typecheck, tests, bundle dry-run). No credentials needed.
# Merge to main →  verify, then apply any unapplied D1 migrations and deploy to Cloudflare.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight verify finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Builds the Worker and validates wrangler.toml without uploading anything,
      # so a broken config fails on the PR instead of after the merge.
      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir=.dry-run

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Optional: add required reviewers to this environment later to gate deploys
    # without touching this file.
    environment:
      name: production
      url: https://massage-feedback.wafiyabdullah39.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Check deploy credentials are configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secrets."
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under"
            echo "Settings → Secrets and variables → Actions. See README."
            exit 1
          fi

      # Idempotent: D1 records applied migrations in d1_migrations, so this only
      # runs new files. Keeps schema ahead of code on every merge.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply massage-feedback --remote

      - name: Deploy
        run: npx wrangler deploy

      - name: Smoke test
        run: |
          set -euo pipefail
          URL=https://massage-feedback.wafiyabdullah39.workers.dev
          for path in / /feedback /privacy; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          # The API must answer with real JSON, not an error page.
          curl -fsS "$URL/api/reviews/summary" | grep -q '"count"' \
            || { echo "::error::summary endpoint did not return expected JSON"; exit 1; }
          echo "Smoke test passed."
