<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f4">
<title>Massage therapy in Petaling Jaya — profile &amp; booking</title>
<meta name="description" content="Traditional, deep tissue and prenatal massage in Petaling Jaya. Prices, opening hours and direct WhatsApp booking.">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💆</text></svg>">
</head>
<body>
<div class="page">
  <div class="wrap">

    <div class="topbar">
      <div class="monogram" id="monogram" aria-hidden="true"></div>
      <div class="who">
        <strong id="top-name">&nbsp;</strong>
        <span id="top-loc">Massage therapist</span>
      </div>
    </div>

    <main class="layout">
        <!-- Hero: who this is, what clients think, how to book -->
        <section class="card hero" aria-labelledby="h-name">
          <p class="eyebrow">Independent massage therapist</p>
          <h1 id="h-name">&nbsp;</h1>
          <p class="tagline small" id="p-tagline">&nbsp;</p>

          <div class="rating-line">
            <span class="avg" id="avg">—</span>
            <span id="avg-stars"></span>
            <span class="small muted" id="review-count">No reviews yet</span>
          </div>

          <div class="cta-row">
            <a class="btn btn-primary" id="wa-btn" href="#" rel="noopener">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2m0 18.15c-1.48 0-2.93-.4-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24s8.24 3.7 8.24 8.24-3.7 8.24-8.24 8.24m4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.51.11-.11.25-.29.37-.43.13-.14.17-.25.25-.41.08-.17.04-.31-.02-.44-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.16 0-.43.06-.66.31-.22.25-.86.85-.86 2.07s.88 2.4 1 2.56c.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18s.21-1.08.15-1.18c-.06-.11-.22-.17-.47-.29"/></svg>
              Book on WhatsApp
            </a>
            <a class="btn btn-ghost btn-icon" id="map-btn" href="#" target="_blank" rel="noopener"
               aria-label="Get directions to the studio" title="Directions">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>
              </svg>
            </a>
          </div>
        </section>

        <!-- About -->
        <section class="sec-about" aria-labelledby="h-about">
          <div class="section-head"><h2 id="h-about">About</h2></div>
          <div class="card"><p class="small" id="p-bio" style="margin:0"></p></div>
        </section>

        <!-- Services -->
        <section class="sec-services" aria-labelledby="h-services">
          <div class="section-head"><h2 id="h-services">Sessions &amp; prices</h2></div>
          <div class="card"><ul class="svc-list" id="svc-list"></ul></div>
        </section>
        <!-- Hours -->
        <section class="sec-hours" aria-labelledby="h-hours">
          <div class="section-head"><h2 id="h-hours">Opening hours</h2></div>
          <div class="card"><ul class="rows" id="hours-list"></ul></div>
        </section>

        <!-- Client feedback: one card at a time, advancing on its own -->
        <section class="reviews sec-reviews" aria-labelledby="h-reviews">
          <div class="section-head">
            <h2 id="h-reviews">Client feedback</h2>
            <span class="tiny muted" id="feed-count"></span>
          </div>

          <div class="carousel" id="carousel" role="group" aria-roledescription="carousel" aria-label="Client feedback">
            <div class="carousel-viewport">
              <div class="carousel-track" id="carousel-track"></div>
            </div>
            <div class="carousel-dots" id="carousel-dots"></div>
          </div>
        </section>
    </main>

    <footer class="footer">
      <p style="margin:0">
        <a href="/privacy">Privacy notice</a>
      </p>
    </footer>
  </div>
</div>

<script type="module" src="/index.js"></script>
</body>
</html>
