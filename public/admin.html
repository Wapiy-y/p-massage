<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f4">
<meta name="robots" content="noindex, nofollow">
<title>Moderation — therapist only</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="page">
  <div class="wrap">
    <div style="padding-top:10px">
      <a class="back" href="/">← Public page</a>
    </div>

    <!-- Login gate -->
    <main id="gate" hidden>
      <h1 style="margin-top:6px">Therapist login</h1>
      <p class="small muted" style="margin:8px 0 22px">
        In production this page sits behind Cloudflare Access (email one-time PIN), so no password
        is needed. Locally, use the passphrase from the server log.
      </p>
      <div class="alert" id="gate-alert" role="alert"></div>
      <form id="gate-form" class="card">
        <div class="field">
          <label for="token">Passphrase</label>
          <input type="password" id="token" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
    </main>

    <!-- Queue -->
    <main id="app" hidden>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px">
        <h1 style="font-size:1.3rem">Moderation</h1>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
      </div>

      <div class="card" style="margin-top:14px;padding:14px">
        <ul class="rows" id="stats"></ul>
      </div>

      <div class="tabs" role="tablist" style="margin-top:18px">
        <button class="tab" role="tab" data-status="pending" aria-selected="true">Pending <span class="n" id="n-pending"></span></button>
        <button class="tab" role="tab" data-status="approved" aria-selected="false">Published <span class="n" id="n-approved"></span></button>
        <button class="tab" role="tab" data-status="rejected" aria-selected="false">Hidden <span class="n" id="n-rejected"></span></button>
      </div>

      <div id="queue"></div>

      <details class="editor card" style="margin-top:22px">
        <summary>Edit profile &amp; services</summary>
        <form id="profile-form" style="margin-top:14px">
          <div class="field">
            <label for="pf-name">Name</label>
            <input type="text" id="pf-name" required>
          </div>
          <div class="field">
            <label for="pf-tagline">Tagline</label>
            <input type="text" id="pf-tagline">
          </div>
          <div class="field">
            <label for="pf-bio">Bio</label>
            <textarea id="pf-bio" style="min-height:96px"></textarea>
          </div>
          <div class="field">
            <label for="pf-whatsapp">WhatsApp number (digits, with country code)</label>
            <input type="tel" id="pf-whatsapp" inputmode="numeric" required>
          </div>
          <div class="field">
            <label for="pf-phone">Phone shown on the page</label>
            <input type="tel" id="pf-phone">
          </div>
          <div class="field">
            <label for="pf-address">Address</label>
            <input type="text" id="pf-address">
          </div>
          <div class="field">
            <label for="pf-map">Map link</label>
            <input type="text" id="pf-map">
          </div>
          <div class="field">
            <label for="pf-note">Short note under the booking buttons</label>
            <input type="text" id="pf-note">
          </div>
          <div class="field">
            <label>Opening hours (one “label | value” per line)</label>
            <textarea id="pf-hours" style="min-height:96px" placeholder="Mon – Fri | 10:00 – 20:00"></textarea>
          </div>
          <div class="field">
            <label>Services (one per line: name | minutes | price RM)</label>
            <textarea id="pf-services" style="min-height:120px" placeholder="Traditional massage | 60 | 90"></textarea>
          </div>
          <p class="err" id="pf-err"></p>
          <button class="btn btn-primary btn-block" type="submit" id="pf-save">Save changes</button>
          <p class="tiny muted" id="pf-ok" style="text-align:center;margin:10px 0 0"></p>
        </form>
      </details>

      <p class="tiny muted" style="text-align:center;margin:24px 0 0">
        <a href="/">View public page</a>
      </p>
    </main>
  </div>
</div>

<script type="module" src="/admin.js"></script>
</body>
</html>
